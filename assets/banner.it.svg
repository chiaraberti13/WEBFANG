<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="WebFang — Toolkit per la sicurezza web offensiva. Contesto, trasformazione, difesa.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1512"/>
      <stop offset="1" stop-color="#241a14"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b955"/>
      <stop offset="1" stop-color="#c97b2b"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b955" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c97b2b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#amber)"/>

  <g opacity="0.5">
    <circle cx="980" cy="70" r="2.5" fill="#f7b955"/>
    <circle cx="1030" cy="110" r="1.8" fill="#f7b955"/>
    <circle cx="1075" cy="60" r="2.2" fill="#c97b2b"/>
    <circle cx="1120" cy="130" r="1.6" fill="#f7b955"/>
    <circle cx="1010" cy="170" r="1.6" fill="#c97b2b"/>
  </g>

  <g transform="translate(92,86)">
    <path d="M0 8 Q64 -8 128 8 L118 54 Q108 128 64 150 Q20 128 10 54 Z"
          fill="none" stroke="url(#amber)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M44 150 Q52 108 44 70" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 150 Q76 108 84 70" fill="none" stroke="url(#amber)" stroke-width="6" stroke-linecap="round"/>
    <rect x="38" y="118" width="52" height="66" rx="6" fill="url(#spark)" opacity="0.55"/>
  </g>

  <text x="270" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" fill="#f5efe8" letter-spacing="1">
    Web<tspan fill="url(#amber)">Fang</tspan>
  </text>
  <text x="272" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600" fill="#b9a99a" letter-spacing="0.5">
    Toolkit per la sicurezza web offensiva
  </text>

  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="600">
    <text x="272" y="236" fill="#8b7a6a">contesto</text>
    <text x="388" y="236" fill="url(#amber)">→</text>
    <text x="414" y="236" fill="#d9c7b4">trasformazione</text>
    <text x="606" y="236" fill="url(#amber)">→</text>
    <text x="632" y="236" fill="#7bd88f">difesa</text>
  </g>

  <text x="1176" y="276" text-anchor="end" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" fill="#6f6052">
    lato client · GPL-3.0 · in sviluppo
  </text>
</svg>
